<text x="447" y="791" text-anchor="middle" style="font-size:12px;fill:#1d4ed8;font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC',sans-serif">排查顺序铁律：先调工艺（0 成本）→ 再修模具（千~万级）→ 最后改结构重开模（万~十万级）</text>
<rect x="24" y="816" width="846" height="69" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
<text x="447" y="834" text-anchor="middle" style="font-size:12px;fill:#334155;font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC',sans-serif">前置检查（任何缺陷先过一遍）</text>
<text x="447" y="851" text-anchor="middle" style="font-size:12px;fill:#334155;font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC',sans-serif">① 原料是否按要求烘干：PC 120 ℃×3~4 h、PA 80 ℃×4 h（未烘干 → 银丝 / 气泡，且水解使强度下降）</text>
<text x="447" y="868" text-anchor="middle" style="font-size:12px;fill:#334155;font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC',sans-serif">② 锁模力是否足够：锁模力(t) ≥ 投影面积(cm²) × 型腔压力(300~500 bar) / 1000（不足 → 必然飞边）</text>
</svg>