 stroke="#16a34a" fill="#f0fdf4" style="stroke-width:2;" /></g><text x="745.500000" y="200.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="745.500000" dy="0.000000">翘曲</tspan><tspan x="745.500000" dy="17.000000">工艺：</tspan><tspan x="745.500000" dy="17.000000">模温均匀 / 降料温</tspan><tspan x="745.500000" dy="17.000000">结构：</tspan><tspan x="745.500000" dy="17.000000">加筋 / 均匀壁厚</tspan></text></g><g class="cTM= q"><g class="shape" ><path d="M 442 423 C 441 423 440 423 440 423 L 308 378 C 307 378 307 377 308 376 L 440 331 C 441 331 444 331 445 331 L 576 376 C 577 376 577 377 576 378 L 444 423 C 444 423 443 423 442 423 Z" stroke="#2563eb" fill="#eff6ff" style="stroke-width:2;" /></g><text x="442.000000" y="382.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">填不满缺料？</text></g><g class="YTM= ans"><g class="shape" ><rect x="647.000000" y="312.000000" width="177.000000" height="130.000000" rx="4.000000" stroke="#16a34a" fill="#f0fdf4" style="stroke-width:2;" /></g><text x="735.500000" y="350.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="735.500000" dy="0.000000">短射</tspan><tspan x="735.500000" dy="17.000000">工艺：</tspan><tspan x="735.500000" dy="17.000000">提料温 / 提速</tspan><tspan x="735.500000" dy="17.000000">模具：</tspan><tspan x="735.500000" dy="17.000000">加大浇口 / 排气</tspan></text></g><g class="cTQ= q"><g class="shape" ><path d="M 442 573 C 441 573 440 573 440 573 L 308 528 C 307 528 307 527 308 526 L 440 481 C 441 481 444 481 445 481 L 576 526 C 577 526 577 527 576 528 L 444 573 C 444 573 443 573 442 573 Z" stroke="#2563eb" fill="#eff6ff" style="stroke-width:2;" /></g><text x="442.000000" y="532.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">有可见接缝？</text></g><g class="YTQ= ans"><g class="shape" ><rect x="647.000000" y="462.000000" width="197.000000" height="130.000000" rx="4.000000" stroke="#16a34a" fill="#f0fdf4" style="stroke-width:2;" /></g><text x="745.500000" y="500.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="745.500000" dy="0.000000">熔接痕</tspan><tspan x="745.500000" dy="17.000000">工艺：</tspan><tspan x="745.500000" dy="17.000000">提模温 / 提速</tspan><tspan x="745.500000" dy="17.000000">模具：</tspan><tspan x="745.500000" dy="17.000000">移浇口 / 加溢料槽</tspan></text></g><g class="cTU= q"><g class="shape" ><path d="M 442 723 C 441 723 440 723 440 723 L 308 678 C 307 678 307 677 308 676 L 440 631 C 441 631 444 631 445 631 L 576 676 C 577 676 577 677 576 678 L 444 723 C 444 723 443 723 442 723 Z" stroke="#2563eb" fill="#eff6ff" style="stroke-width:2;" /></g><text x="442.000000" y="682.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">分型面溢料？</text></g><g class="YTU= ans"><g class="shape" ><rect x="647.000000" y="612.000000" width="217.000000" height="130.000000" rx="4.000000" stroke="#16a34a" fill="#f0fdf4" style="stroke-width:2;" /></g><text x="755.500000" y="650.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="755.500000" dy="0.000000">飞边</tspan><tspan x="755.500000" dy="17.000000">工艺：</tspan><tspan x="755.500000" dy="17.000000">降压力 / 降料温</tspan><tspan x="755.500000" dy="17.000000">模具：</tspan><tspan x="755.500000" dy="17.000000">修分型面 / 加锁模力</tspan></text></g><g class="KHMwIC0mZ3Q7IHExKVswXQ=="><marker id="mk-d2-2440701399-3488378134" markerWidth="10.000000" markerHeight="12.000000" refX="7.000000" refY="6.000000" viewBox="0.000000 0.000000 10.000000 12.000000" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0.000000,0.000000 10.000000,6.000000 0.000000,12.000000" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 179.000000 310.333008 L 207.000000 310.333008 S 217.000000 310.333008 217.000000 300.333008 L 217.000000 87.000000 S 217.000000 77.000000 227.000000 77.000000 L 30